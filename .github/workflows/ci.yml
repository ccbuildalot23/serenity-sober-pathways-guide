name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [ fix/seed-and-tests ]
  pull_request:
    branches: [ fix/seed-and-tests ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout parent
        uses: actions/checkout@v4

      - name: Checkout portal
        uses: actions/checkout@v4
        with:
          repository: ccbuildalot23/serenity-provider-portal
          ref: feat/provider-roi-billing-panel
          path: serenity-provider-portal
          fetch-depth: 1
          token: ${{ secrets.PORTAL_REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies (parent)
        run: pnpm i

      - name: Install dependencies (portal)
        run: pnpm --dir serenity-provider-portal i --no-frozen-lockfile

      - name: Install Playwright Browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run Jest unit tests (parent)
        run: pnpm test:unit

      - name: Pre-warm portal
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          LOG=.prewarm.log
          (pnpm -C serenity-provider-portal dev -- --port 5174 --strictPort --host > $LOG 2>&1) &
          for i in {1..120}; do
            if curl -fsS http://localhost:5174/api/healthz >/dev/null 2>&1; then
              echo "healthz OK"; break
            fi
            # if dev process crashed, surface logs and fail fast
            if ! ps -ef | grep "[p]npm -C serenity-provider-portal dev" >/dev/null; then
              echo "::group::Dev process exited early - last 400 lines"; (tail -n 400 $LOG || true); echo "::endgroup::"; exit 1
            fi
            sleep 2
          done
          curl -fsS http://localhost:5174/api/healthz
          echo "::group::Dev log tail"; (tail -n 100 $LOG || true); echo "::endgroup::"

      - name: Run Playwright (Chromium)
        env:
          VITE_PORT: 5174
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
          CI_PROVIDER_ID: demo-provider-0001
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npx playwright test tests/e2e/csv-smoke.spec.ts tests/e2e/security-headers*.spec.ts --project=chromium --reporter=line
