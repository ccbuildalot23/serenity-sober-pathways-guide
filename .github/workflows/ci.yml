name: CI (jest + playwright)

on:
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout parent repo
        uses: actions/checkout@v4

      - name: Checkout portal repo (no submodule)
        uses: actions/checkout@v4
        with:
          repository: ccbuildalot23/serenity-provider-portal
          ref: feat/provider-roi-billing-panel
          path: serenity-provider-portal
          fetch-depth: 1
          # token not required if repo is public; if private, add a read-only token in repo secrets

      - name: Debug env
        run: |
          node -v || true
          pnpm -v || true
          git --version
          ls -la
          ls -la serenity-provider-portal || true

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }

      - name: Install deps (parent)
        run: pnpm i

      - name: Install deps (portal)
        run: pnpm --dir serenity-provider-portal i --no-frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Jest
        run: pnpm test:jest

      - name: Pre-warm portal
        run: |
          nohup pnpm -C serenity-provider-portal dev -- --port 5174 --strictPort --host >/dev/null 2>&1 &
          npx wait-on http://localhost:5174 || true

      - name: Playwright (Chromium only)
        env:
          VITE_PORT: 5174
          SMOKE_TOKEN: ci-ok
          CI_PROVIDER_ID: demo-provider-0001
        run: pnpm test:pw --reporter=line --project=chromium --grep "csv smoke|capture ROI panel screenshot"
