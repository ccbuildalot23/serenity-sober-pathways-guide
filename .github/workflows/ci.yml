name: CI

on:
  push:
    branches: [ fix/seed-and-tests ]
  pull_request:
    branches: [ fix/seed-and-tests ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout parent
        uses: actions/checkout@v4

      - name: Checkout portal
        uses: actions/checkout@v4
        with:
          repository: ccbuildalot23/serenity-provider-portal
          ref: feat/provider-roi-billing-panel
          path: serenity-provider-portal
          fetch-depth: 1
          token: ${{ secrets.PORTAL_REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies (parent)
        run: pnpm i

      - name: Install dependencies (portal)
        run: pnpm --dir serenity-provider-portal i --no-frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Jest (parent)
        run: pnpm test:jest

      - name: Pre-warm portal
        run: |
          nohup pnpm -C serenity-provider-portal dev -- --port 5174 --strictPort --host >/dev/null 2>&1 &
          npx wait-on http://localhost:5174 --timeout 180000

      - name: Run Playwright (Chromium)
        env:
          VITE_PORT: 5174
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
          CI_PROVIDER_ID: demo-provider-0001
        run: pnpm test:pw --project=chromium --reporter=line
