name: CI

on:
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install parent deps
        run: pnpm i
      - name: Install portal deps (submodule)
        run: pnpm -C serenity-provider-portal i
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Seed (no-op if env missing)
        run: pnpm run dev:seed
      - name: Run Jest
        run: pnpm test:jest
      - name: Playwright e2e (ROI + CSV smoke)
        env:
          VITE_PORT: '5174'
          SMOKE_TOKEN: 'ci-ok'
          CI_PROVIDER_ID: 'demo-provider-0001'
        run: pnpm test:pw --reporter=line