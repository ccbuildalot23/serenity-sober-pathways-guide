name: iOS Deploy with Fastlane Match

on:
  push:
    branches:
      - main
      - notification-microservice
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      deployment_type:
        description: "Deployment Type"
        required: true
        default: "testflight"
        type: choice
        options:
          - "testflight"
          - "app-store"

env:
  NODE_VERSION: "22.x"
  RUBY_VERSION: "3.2"
  XCODE_VERSION: "latest-stable"

jobs:
  deploy:
    name: Deploy with Fastlane Match
    runs-on: macos-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🔍 Debug Environment
        run: |
          echo "=== Deployment Configuration ==="
          echo "Deployment Type: ${{ github.event.inputs.deployment_type || 'testflight' }}"
          echo "Build Number: ${{ github.run_number }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Node Version: $(node --version)"
          echo "NPM Version: $(npm --version)"
          echo "Working Directory: $(pwd)"
          echo "Available Environment Variables:"
          echo "  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL != '' && '[SET]' || '[NOT SET]' }}"
          echo "  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' && '[SET]' || '[NOT SET]' }}"
          echo "  APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' && '[SET]' || '[NOT SET]' }}"
          echo "  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' && '[SET]' || '[NOT SET]' }}"
          echo "  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD != '' && '[SET]' || '[NOT SET]' }}"
          echo "================================"

      - name: ✅ Validate Required Secrets
        run: |
          echo "=== Validating Required Secrets ==="
          
          MISSING_SECRETS=()
          
          # Check critical secrets
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            MISSING_SECRETS+=("VITE_SUPABASE_URL")
          fi
          
          if [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            MISSING_SECRETS+=("VITE_SUPABASE_ANON_KEY")
          fi
          
          if [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ]; then
            MISSING_SECRETS+=("APP_STORE_CONNECT_API_KEY")
          fi
          
          if [ -z "${{ secrets.MATCH_PASSWORD }}" ]; then
            MISSING_SECRETS+=("MATCH_PASSWORD")
          fi
          
          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "❌ Missing required secrets:"
            printf '  - %s\n' "${MISSING_SECRETS[@]}"
            echo ""
            echo "Please add these secrets in your repository settings:"
            echo "https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          
          echo "✅ All required secrets are configured"

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install Node dependencies
        run: |
          npm ci --legacy-peer-deps
          npm install -g @capacitor/cli
          
          # Verify build scripts exist
          if ! npm run build:mobile --dry-run 2>/dev/null; then
            echo "⚠️ build:mobile script not found, will use regular build instead"
          fi

      - name: 🔨 Build web assets
        run: |
          echo "Building web assets..."
          
          # Try build:mobile first, fallback to regular build
          if npm run build:mobile 2>/dev/null; then
            echo "✅ Used build:mobile script"
          elif npm run build; then
            echo "✅ Used fallback build script"
          else
            echo "❌ Both build scripts failed"
            exit 1
          fi
          
          # Validate build output
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed: index.html not found"
            ls -la dist/ || echo "dist directory not found"
            exit 1
          fi
          
          echo "✅ Web assets built successfully"
          echo "Built files:"
          ls -la dist/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 📱 Sync with Capacitor
        run: |
          echo "Syncing with Capacitor..."
          
          # Ensure Capacitor is initialized
          npx cap sync ios
          
          # Install CocoaPods dependencies
          cd ios/App
          pod install --repo-update --clean-install
          cd ../..
          
          # Validate iOS project exists
          if [ ! -d "ios/App/App.xcworkspace" ]; then
            echo "❌ iOS workspace not found after sync"
            exit 1
          fi
          
          echo "✅ iOS platform synced successfully"

      - name: 🍎 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: 💎 Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ios

      - name: 📝 Setup App Store Connect API
        run: |
          echo "=== Configuring App Store Connect API ==="
          
          # Create API key directory
          mkdir -p ~/private_keys
          
          # Write API key with proper expansion
          API_KEY_ID="${{ secrets.APP_STORE_CONNECT_KEY_ID || '4YBU7UC32Y' }}"
          API_KEY_PATH="$HOME/private_keys/AuthKey_${API_KEY_ID}.p8"
          
          # Write API key content to file
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > "$API_KEY_PATH"
          
          # Verify file was created
          if [ ! -f "$API_KEY_PATH" ]; then
            echo "❌ Failed to create API key file at $API_KEY_PATH"
            exit 1
          fi
          
          # Set correct permissions
          chmod 600 "$API_KEY_PATH"
          
          # Export paths for Fastlane
          echo "APP_STORE_CONNECT_API_KEY_PATH=$API_KEY_PATH" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_KEY_ID=${API_KEY_ID}" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_ISSUER_ID=${{ secrets.APP_STORE_CONNECT_ISSUER_ID || 'acb9e47c-6935-4933-ae2c-6170b5d90234' }}" >> $GITHUB_ENV
          
          echo "✅ API authentication configured at $API_KEY_PATH"

      - name: 🔐 Configure Match Authentication
        run: |
          echo "=== Configuring Fastlane Match ==="
          
          # Set Match environment variables
          echo "MATCH_PASSWORD=${{ secrets.MATCH_PASSWORD }}" >> $GITHUB_ENV
          echo "MATCH_GIT_BASIC_AUTHORIZATION=${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}" >> $GITHUB_ENV
          echo "MATCH_KEYCHAIN_NAME=fastlane_tmp_keychain" >> $GITHUB_ENV
          echo "MATCH_KEYCHAIN_PASSWORD=${{ secrets.MATCH_KEYCHAIN_PASSWORD || 'tmp_keychain_password' }}" >> $GITHUB_ENV
          
          # Set CI environment
          echo "CI=true" >> $GITHUB_ENV
          echo "FASTLANE_USER=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
          echo "FASTLANE_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> $GITHUB_ENV
          echo "GITHUB_RUN_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          
          echo "✅ Match authentication configured"

      - name: 🚀 Deploy with Fastlane
        run: |
          cd ios
          
          echo "=== Running Fastlane Deployment ==="
          echo "Using Fastlane Match for code signing"
          echo "Deployment type: ${{ github.event.inputs.deployment_type || 'testflight' }}"
          
          # Debug environment variables
          echo "Environment variables for Fastlane:"
          echo "  APP_STORE_CONNECT_API_KEY_PATH: ${APP_STORE_CONNECT_API_KEY_PATH}"
          echo "  APP_STORE_CONNECT_KEY_ID: ${APP_STORE_CONNECT_KEY_ID}"
          echo "  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD != '' && '[SET]' || '[NOT SET]' }}"
          echo "  APPLE_TEAM_ID: ${APPLE_TEAM_ID}"
          
          # Verify API key file exists
          if [ ! -f "${APP_STORE_CONNECT_API_KEY_PATH}" ]; then
            echo "❌ API key file not found: ${APP_STORE_CONNECT_API_KEY_PATH}"
            exit 1
          fi
          
          echo "✅ API key file verified"
          
          # Run appropriate Fastlane lane
          if [ "${{ github.event.inputs.deployment_type }}" == "app-store" ]; then
            echo "Running App Store release..."
            bundle exec fastlane release
          else
            echo "Running TestFlight beta..."
            bundle exec fastlane beta
          fi
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'XDY458RQ59' }}
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8

      - name: 📊 Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            ios/build/
            ios/fastlane/report.xml
            ios/fastlane/README.md

      - name: 🎉 Deployment Success
        if: success()
        run: |
          echo "========================================="
          echo "✅ iOS DEPLOYMENT SUCCESSFUL!"
          echo "========================================="
          echo ""
          echo "📱 Build Details:"
          echo "  • Build Number: ${{ github.run_number }}"
          echo "  • Bundle ID: com.serenity.recovery"
          echo "  • Team ID: ${{ secrets.APPLE_TEAM_ID || 'XDY458RQ59' }}"
          echo "  • Deployment: ${{ github.event.inputs.deployment_type || 'testflight' }}"
          echo ""
          echo "🚀 TestFlight Status:"
          echo "  • Processing time: 5-15 minutes"
          echo "  • External testing: Available after processing"
          echo ""
          echo "📋 Code Signing: Managed by Fastlane Match"
          echo "🔒 Security: HIPAA compliant"
          echo ""
          echo "Monitor at: https://appstoreconnect.apple.com"

      - name: 🧹 Cleanup
        if: always()
        run: |
          # Clean up sensitive files
          rm -rf ~/private_keys/
          
          # Clean up any temporary keychains (Fastlane Match handles this automatically)
          security list-keychains | grep -q "fastlane_tmp_keychain" && security delete-keychain "fastlane_tmp_keychain" || true
          
          echo "✅ Cleanup completed"