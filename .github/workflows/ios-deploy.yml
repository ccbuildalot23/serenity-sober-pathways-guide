name: iOS App Store Deployment

on:
  push:
    branches:
      - main
      - notification-microservice
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/!(ios-deploy.yml)"
  workflow_dispatch:
    inputs:
      deploy_to_testflight:
        description: "Deploy to TestFlight"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  NODE_VERSION: "22.x"
  XCODE_VERSION: "15.0"

jobs:
  build-and-deploy:
    name: Build iOS App and Deploy to TestFlight
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 📦 Install dependencies
        run: |
          npm ci --legacy-peer-deps
          npm install -g @capacitor/cli

      - name: 🔨 Build web assets
        run: |
          npm run build
          echo "📁 Verifying dist folder contents:"
          ls -la dist/
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed - no index.html in dist"
            exit 1
          fi
          echo "✅ Build successful - index.html found in dist"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 📱 Sync with iOS platform
        run: |
          echo "🔄 Preparing iOS platform..."
          
          # Add iOS platform if not exists
          if [ ! -d "ios" ]; then
            echo "📱 Adding iOS platform..."
            npx cap add ios
          fi
          
          # Clean previous build artifacts
          echo "🧹 Cleaning previous iOS build artifacts..."
          rm -rf ios/App/App/public/* || true
          
          # Copy web assets explicitly
          echo "📋 Copying web assets to iOS..."
          npx cap copy ios
          
          # Wait for file system sync
          sleep 2
          
          # Verify copy worked
          echo "📁 iOS public folder contents:"
          ls -la ios/App/App/public/ || echo "Directory not found"
          
          # Sync without reinstalling pods
          echo "🔄 Running Capacitor sync..."
          npx cap sync ios --deployment
          
          # Verification with retry logic
          echo "🔍 Verifying files with retry logic..."
          for i in 1 2 3; do
            if [ -f "ios/App/App/public/index.html" ]; then
              echo "✅ index.html verified in iOS folder (attempt $i)"
              break
            else
              echo "⏳ Waiting for sync to complete... (attempt $i)"
              sleep 3
              npx cap copy ios
            fi
          done
          
          # Final check
          if [ ! -f "ios/App/App/public/index.html" ]; then
            echo "❌ CRITICAL: index.html still missing after retries"
            echo "📁 Looking for index.html in project:"
            find . -name "index.html" -type f | head -10
            echo "📁 iOS App public directory structure:"
            ls -la ios/App/App/ || echo "iOS App directory not found"
            ls -la ios/App/App/public/ || echo "iOS public directory not found"
            exit 1
          fi
          
          echo "🎨 Validating CSS is properly linked..."
          if grep -q '<link.*stylesheet.*href="/assets/.*\.css"' ios/App/App/public/index.html; then
            echo "✅ CSS link found in iOS index.html"
            CSS_FILE=$(grep -o 'href="/assets/[^"]*\.css"' ios/App/App/public/index.html | head -1 | sed 's/href="\/assets\///;s/"//')
            if [ -f "ios/App/App/public/assets/$CSS_FILE" ]; then
              echo "✅ CSS file verified: $CSS_FILE"
            else
              echo "⚠️ CSS file not found: $CSS_FILE - attempting to copy assets..."
              cp -r dist/assets ios/App/App/public/ || true
            fi
          else
            echo "⚠️ No CSS link found - copying all dist files..."
            cp -r dist/* ios/App/App/public/ || true
          fi
          
          echo "✅ iOS platform synced and verified"

      - name: 💎 Install CocoaPods dependencies
        run: |
          echo "📦 Installing CocoaPods dependencies..."
          cd ios/App
          # Install pods directly without bundle exec
          pod install --repo-update || pod install
          cd ../..
          echo "✅ CocoaPods dependencies installed"

      - name: 🍎 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 🔐 Setup iOS certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i $PP_PATH | plutil -extract UUID raw -)
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> $GITHUB_ENV

      - name: 📝 Update version and build number
        run: |
          cd ios/App
          # Update version in Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" App/Info.plist

      - name: 🏗️ Build iOS app
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -derivedDataPath build \
            -archivePath build/App.xcarchive \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            archive \
            CODE_SIGNING_ALLOWED="NO"

      - name: 📦 Export IPA
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          cd ios/App
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          
          # Ensure keychain is unlocked and available
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain
          
          # Create dynamic ExportOptions.plist with UUID
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.serenity.recovery</key>
                  <string>$PROVISIONING_PROFILE_UUID</string>
              </dict>
              <key>uploadBitcode</key>
              <false/>
              <key>compileBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build \
            -exportOptionsPlist ExportOptions.plist

      - name: ✅ Validate IPA before upload
        run: |
          cd ios/App
          echo "🔍 Validating IPA file..."
          
          # Check if IPA was created successfully
          if [ ! -f "build/App.ipa" ]; then
            echo "❌ IPA file not found!"
            exit 1
          fi
          
          echo "📁 IPA file details:"
          ls -lh build/App.ipa
          
          # Validate IPA structure
          echo "🔍 Checking IPA structure..."
          unzip -l build/App.ipa | head -20
          
          # Create API key file for validation
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          
          # Validate app with Apple's servers
          echo "🔍 Validating with App Store Connect..."
          xcrun altool --validate-app \
            -f "build/App.ipa" \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --verbose || echo "⚠️ Validation warnings found, proceeding with upload..."

      - name: 🚀 Upload to TestFlight
        if: github.event.inputs.deploy_to_testflight != 'false'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          # Create API key file
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8
          
          # Verify IPA file exists
          if [ ! -f "ios/App/build/App.ipa" ]; then
            echo "❌ IPA file not found at ios/App/build/App.ipa"
            exit 1
          fi
          
          echo "📱 IPA file found: $(ls -lh ios/App/build/App.ipa)"
          
          # Method 1: Try using altool (recommended alternative to iTMSTransporter)
          echo "🔄 Attempting upload using altool..."
          if xcrun altool --upload-app \
            -f "ios/App/build/App.ipa" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose; then
            echo "✅ Upload successful using altool"
            exit 0
          else
            echo "⚠️ altool upload failed, trying iTMSTransporter..."
          fi
          
          # Method 2: Install Transporter app and use iTMSTransporter
          echo "📥 Installing Apple Transporter..."
          if ! command -v mas &> /dev/null; then
            echo "Installing mas (Mac App Store CLI)..."
            brew install mas
          fi
          
          # Alternative: Download and install Transporter manually
          echo "📦 Installing Transporter app..."
          brew install --cask transporter
          
          # Wait for installation to complete
          sleep 5
          
          # Verify Transporter installation
          if [ -d "/Applications/Transporter.app" ]; then
            export FASTLANE_ITUNES_TRANSPORTER_PATH="/Applications/Transporter.app/Contents/itms/bin"
            export FASTLANE_ITUNES_TRANSPORTER_USE_SHELL_SCRIPT="true"
            
            echo "✅ Transporter found at: $FASTLANE_ITUNES_TRANSPORTER_PATH"
            ls -la "$FASTLANE_ITUNES_TRANSPORTER_PATH/"
            
            # Upload using iTMSTransporter with explicit path
            echo "🚀 Uploading using iTMSTransporter..."
            "$FASTLANE_ITUNES_TRANSPORTER_PATH/iTMSTransporter" -m upload \
              -assetFile "ios/App/build/App.ipa" \
              -apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
              -apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
              -v informational
          else
            echo "❌ Transporter installation failed"
            echo "🔄 Falling back to xcrun altool with retry..."
            
            # Final attempt with altool
            xcrun altool --upload-app \
              -f "ios/App/build/App.ipa" \
              -t ios \
              --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --verbose
          fi

      - name: 📊 Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-artifacts
          path: |
            ios/App/build/App.ipa
            ios/App/build/App.xcarchive

      - name: 🎉 Deployment Summary
        if: success()
        run: |
          echo "✅ iOS app successfully built and deployed!"
          echo "📱 Build number: ${{ github.run_number }}"
          echo "🚀 Check TestFlight in App Store Connect"
          echo "📋 Next steps:"
          echo "  1. Go to https://appstoreconnect.apple.com"
          echo "  2. Select your app"
          echo "  3. Go to TestFlight tab"
          echo "  4. Submit for App Store review"

      - name: 🧹 Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision
