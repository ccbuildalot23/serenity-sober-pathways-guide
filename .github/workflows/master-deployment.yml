name: Master Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: 'Skip tests (emergency use only)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20.x'
  DEPLOYMENT_TIMEOUT: 900 # 15 minutes

jobs:
  # Phase 1: Pre-deployment validation
  validation:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linting
        if: ${{ !inputs.skip_tests }}
        run: npm run lint:fix

      - name: Run type checking
        if: ${{ !inputs.skip_tests }}
        run: npm run typecheck

      - name: Generate version
        id: version
        run: |
          VERSION="v$(node -p "require('./package.json').version")-$(date +%Y%m%d)-${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Check deployment conditions
        id: check
        run: |
          # Check if we should deploy
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

  # Phase 2: Security & Compliance
  security:
    name: Security & HIPAA Compliance
    runs-on: ubuntu-latest
    needs: validation
    if: needs.validation.outputs.should_deploy == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run security audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: HIPAA compliance check
        if: ${{ !inputs.skip_tests }}
        run: npm run validate:hipaa || true

      - name: Check for secrets
        run: |
          # Scan for potential secrets in code
          if grep -r --exclude-dir=node_modules --exclude-dir=.git \
               -E "(api[_-]?key|secret|password|token|private[_-]?key)" \
               --include="*.js" --include="*.ts" --include="*.tsx" \
               . | grep -v "// " | grep -v "process.env"; then
            echo "⚠️ Warning: Potential secrets found in code"
          else
            echo "✅ No hardcoded secrets detected"
          fi

  # Phase 3: Test Suite
  testing:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: validation
    if: needs.validation.outputs.should_deploy == 'true' && !inputs.skip_tests
    strategy:
      matrix:
        test-suite:
          - e2e
          - integration
          - performance
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        if: matrix.test-suite == 'e2e'
        run: npx playwright install --with-deps

      - name: Run ${{ matrix.test-suite }} tests
        run: |
          if [[ "${{ matrix.test-suite }}" == "e2e" ]]; then
            npm run test:e2e
          elif [[ "${{ matrix.test-suite }}" == "integration" ]]; then
            npm run test:notifications:integration || true
          elif [[ "${{ matrix.test-suite }}" == "performance" ]]; then
            npm run test:performance:load || true
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-suite }}
          path: |
            playwright-report/
            test-results/

  # Phase 4: Build & Package
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [validation, security, testing]
    if: |
      always() && 
      needs.validation.outputs.should_deploy == 'true' &&
      (needs.testing.result == 'success' || needs.testing.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          NODE_ENV: production

      - name: Validate build
        run: |
          # Check build output
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          
          # Check critical files
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed: index.html not found"
            exit 1
          fi
          
          echo "✅ Build validation passed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ needs.validation.outputs.version }}
          path: dist/
          retention-days: 7

  # Phase 5: Deploy to Vercel
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [validation, build]
    if: |
      always() && 
      needs.build.result == 'success'
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.validation.outputs.version }}
          path: dist/

      - name: Deploy to Vercel
        id: deploy
        run: |
          # Install Vercel CLI
          npm i -g vercel
          
          # Deploy to Vercel
          if [[ "${{ inputs.environment }}" == "staging" ]]; then
            URL=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes --archive=tgz)
          else
            URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes --archive=tgz)
          fi
          
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "🚀 Deployed to: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Phase 6: Health Check
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: deploy-vercel
    if: always() && needs.deploy-vercel.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Wait for deployment
        run: sleep 30

      - name: Run health checks
        run: |
          URL="${{ needs.deploy-vercel.outputs.url || 'https://serenity-sober-pathways-guide.vercel.app' }}"
          
          echo "🔍 Checking health at: $URL"
          
          # Check main page
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$URL")
          if [[ $HTTP_STATUS -eq 200 ]]; then
            echo "✅ Main page: OK ($HTTP_STATUS)"
          else
            echo "❌ Main page: Failed ($HTTP_STATUS)"
            exit 1
          fi
          
          # Check API health
          API_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$URL/api/health" || echo "404")
          if [[ $API_STATUS -eq 200 ]] || [[ $API_STATUS -eq 404 ]]; then
            echo "✅ API health: OK ($API_STATUS)"
          else
            echo "⚠️ API health: Warning ($API_STATUS)"
          fi
          
          # Check critical pages
          for PAGE in "login" "checkin" "crisis"; do
            PAGE_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$URL/$PAGE")
            if [[ $PAGE_STATUS -eq 200 ]] || [[ $PAGE_STATUS -eq 301 ]] || [[ $PAGE_STATUS -eq 302 ]]; then
              echo "✅ /$PAGE: OK ($PAGE_STATUS)"
            else
              echo "⚠️ /$PAGE: Warning ($PAGE_STATUS)"
            fi
          done

      - name: Run Lighthouse audit
        continue-on-error: true
        run: |
          npm i -g @lhci/cli
          
          URL="${{ needs.deploy-vercel.outputs.url || 'https://serenity-sober-pathways-guide.vercel.app' }}"
          
          lhci autorun \
            --collect.url="$URL" \
            --assert.preset="lighthouse:recommended" \
            --assert.assertions.categories:performance=off \
            --assert.assertions.categories:pwa=off \
            || echo "⚠️ Lighthouse audit completed with warnings"

  # Phase 7: Rollback on failure
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: [deploy-vercel, health-check]
    if: failure() && needs.deploy-vercel.result == 'success'
    steps:
      - name: Trigger rollback
        run: |
          echo "🔄 Initiating rollback..."
          # Vercel automatically maintains previous deployments
          # Manual rollback can be done through Vercel dashboard
          echo "⚠️ Automatic rollback not implemented. Please rollback manually through Vercel dashboard if needed."

  # Phase 8: Post-deployment
  post-deployment:
    name: Post-deployment Tasks
    runs-on: ubuntu-latest
    needs: [validation, deploy-vercel, health-check]
    if: always() && needs.health-check.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Create release tag
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          TAG="${{ needs.validation.outputs.version }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG" || echo "Tag already exists"

      - name: Send deployment notification
        run: |
          echo "✅ Deployment completed successfully!"
          echo "📦 Version: ${{ needs.validation.outputs.version }}"
          echo "🌐 URL: ${{ needs.deploy-vercel.outputs.url || 'https://serenity-sober-pathways-guide.vercel.app' }}"
          echo "🚀 Environment: ${{ inputs.environment || 'production' }}"

      - name: Update deployment status
        run: |
          # Create deployment record (for GitHub deployments API)
          echo '{
            "ref": "${{ github.sha }}",
            "environment": "${{ inputs.environment || 'production' }}",
            "description": "Deployment ${{ needs.validation.outputs.version }}",
            "production_environment": true,
            "auto_merge": false
          }' > deployment.json

  # Summary job
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [validation, security, testing, build, deploy-vercel, health-check]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# 📊 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 📦 Version" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.validation.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 🎯 Status" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ needs.validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Testing | ${{ needs.testing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy-vercel.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | ${{ needs.health-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.health-check.result }}" == "success" ]]; then
            echo "## ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
            echo "🌐 URL: ${{ needs.deploy-vercel.outputs.url || 'https://serenity-sober-pathways-guide.vercel.app' }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Deployment Issues Detected" >> $GITHUB_STEP_SUMMARY
            echo "Please check the failed jobs for more information." >> $GITHUB_STEP_SUMMARY
          fi