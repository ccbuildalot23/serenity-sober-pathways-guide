name: Post-merge CSV Smoke

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm i --ignore-scripts
      - name: Run CSV smoke against production
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
          CI_PROVIDER_ID: ${{ secrets.CI_PROVIDER_ID }}
        run: pnpm smoke:csv
