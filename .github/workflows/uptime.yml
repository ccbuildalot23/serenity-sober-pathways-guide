name: Uptime Checks

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ping homepage and CSV
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
          CI_PROVIDER_ID: ${{ secrets.CI_PROVIDER_ID }}
        run: |
          set -e
          echo "Pinging $PROD_URL" && curl -fsSL "$PROD_URL/" >/dev/null
          echo "Pinging healthz" && curl -fsSL "$PROD_URL/api/healthz" >/dev/null || true
          echo "Pinging CSV endpoint" && curl -fsSL -H "x-smoke-token: $SMOKE_TOKEN" "$PROD_URL/api/billing/providers/${CI_PROVIDER_ID}/summary.csv?month=$(date +%Y-%m)" >/dev/null


