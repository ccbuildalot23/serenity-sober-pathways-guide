worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /var/log/nginx/access.log main;
    
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private must-revalidate;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json application/xml+rss;
    
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=crisis:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # Upstream health check configuration
    upstream auth_service {
        server host.docker.internal:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream notification_service {
        server host.docker.internal:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream crisis_service {
        server host.docker.internal:8080 max_fails=2 fail_timeout=15s;
        keepalive 32;
    }
    
    upstream frontend_app {
        server host.docker.internal:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # Circuit breaker status tracking
    map $upstream_response_time $circuit_breaker_status {
        default "closed";
        "~^[5-9]\." "open";
        "~^[1-9][0-9]+\." "open";
    }
    
    # Health check endpoints
    server {
        listen 80;
        server_name circuit-breaker;
        
        # Health check for circuit breaker itself
        location /health {
            access_log off;
            return 200 "Circuit Breaker OK\n";
            add_header Content-Type text/plain;
        }
        
        # Circuit breaker status endpoint
        location /circuit-status {
            access_log off;
            content_by_lua_block {
                local status = {
                    auth_service = "closed",
                    notification_service = "closed", 
                    crisis_service = "closed",
                    frontend_app = "closed",
                    timestamp = ngx.time()
                }
                ngx.header.content_type = "application/json"
                ngx.say(require("cjson").encode(status))
            }
        }
        
        # Fallback pages for circuit breaker
        location /maintenance {
            root /usr/share/nginx/html;
            try_files /maintenance.html =503;
        }
        
        location /crisis-fallback {
            root /usr/share/nginx/html;
            try_files /crisis-fallback.html =503;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Circuit-Breaker "open";
        }
        
        # Error pages
        error_page 502 503 504 /maintenance;
        error_page 500 /maintenance;
        
        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none';" always;
    }
    
    # Lua script for circuit breaker logic
    init_by_lua_block {
        local circuit_breaker = {}
        circuit_breaker.services = {
            auth_service = { failures = 0, last_failure = 0, state = "closed" },
            notification_service = { failures = 0, last_failure = 0, state = "closed" },
            crisis_service = { failures = 0, last_failure = 0, state = "closed" },
            frontend_app = { failures = 0, last_failure = 0, state = "closed" }
        }
        circuit_breaker.thresholds = {
            failure_threshold = 5,
            recovery_timeout = 60,
            half_open_requests = 3
        }
        
        function circuit_breaker:check_circuit(service_name)
            local service = self.services[service_name]
            local now = ngx.time()
            
            if service.state == "open" then
                if now - service.last_failure > self.thresholds.recovery_timeout then
                    service.state = "half-open"
                    service.failures = 0
                    ngx.log(ngx.WARN, "Circuit breaker half-open for: " .. service_name)
                    return "half-open"
                else
                    return "open"
                end
            end
            
            return service.state
        end
        
        function circuit_breaker:record_success(service_name)
            local service = self.services[service_name]
            service.failures = 0
            service.state = "closed"
        end
        
        function circuit_breaker:record_failure(service_name)
            local service = self.services[service_name]
            service.failures = service.failures + 1
            service.last_failure = ngx.time()
            
            if service.failures >= self.thresholds.failure_threshold then
                service.state = "open"
                ngx.log(ngx.ERR, "Circuit breaker opened for: " .. service_name)
            end
        end
        
        _G.circuit_breaker = circuit_breaker
    }
}

stream {
    # WebSocket proxy with circuit breaker
    upstream websocket_backend {
        server host.docker.internal:8001 max_fails=2 fail_timeout=30s;
    }
    
    server {
        listen 8081;
        proxy_pass websocket_backend;
        proxy_timeout 1h;
        proxy_responses 1;
        error_log /var/log/nginx/websocket_error.log;
    }
}