input {
  # Kong logs via HTTP
  http {
    port => 5000
    codec => json
    type => "kong-logs"
  }
  
  # Syslog input for system logs
  syslog {
    port => 514
    type => "syslog"
  }
  
  # File input for application logs
  file {
    path => "/var/log/serenity/*.log"
    start_position => "beginning"
    type => "application-logs"
    codec => json
  }
  
  # Beats input for metric data
  beats {
    port => 5044
    type => "beats"
  }
}

filter {
  # Kong log processing
  if [type] == "kong-logs" {
    # Parse Kong request/response data
    if [request] {
      mutate {
        add_field => { 
          "request_method" => "%{[request][method]}"
          "request_uri" => "%{[request][uri]}"
          "request_size" => "%{[request][size]}"
          "client_ip" => "%{[client_ip]}"
        }
      }
    }
    
    if [response] {
      mutate {
        add_field => { 
          "response_status" => "%{[response][status]}"
          "response_size" => "%{[response][size]}"
          "response_time" => "%{[latencies][request]}"
        }
      }
    }
    
    # HIPAA compliance fields
    if [authenticated_entity] {
      mutate {
        add_field => { 
          "user_id" => "%{[authenticated_entity][id]}"
          "user_type" => "%{[authenticated_entity][consumer_type]}"
        }
      }
    }
    
    # Security classification
    if [request][uri] =~ /crisis|emergency/ {
      mutate {
        add_field => { "priority" => "critical" }
        add_field => { "data_classification" => "PHI" }
        add_field => { "audit_required" => "true" }
      }
    } else if [request][uri] =~ /auth|login|password/ {
      mutate {
        add_field => { "priority" => "high" }
        add_field => { "data_classification" => "PII" }
        add_field => { "audit_required" => "true" }
      }
    } else {
      mutate {
        add_field => { "priority" => "normal" }
        add_field => { "audit_required" => "false" }
      }
    }
    
    # Convert timestamp
    date {
      match => [ "started_at", "UNIX_MS" ]
      target => "@timestamp"
    }
    
    # GeoIP lookup for security analysis
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }
  
  # Application log processing
  if [type] == "application-logs" {
    # Parse different log formats
    if [fields][service] == "auth-service" {
      grok {
        match => { 
          "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{DATA:logger} - %{GREEDYDATA:msg}" 
        }
      }
    } else if [fields][service] == "crisis-service" {
      grok {
        match => { 
          "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} \[%{DATA:component}\] %{GREEDYDATA:msg}" 
        }
      }
      
      # Mark crisis logs as high priority
      mutate {
        add_field => { "priority" => "critical" }
        add_field => { "data_classification" => "PHI" }
      }
    }
    
    # Parse JSON logs
    if [msg] =~ /^\{.*\}$/ {
      json {
        source => "msg"
        target => "parsed_json"
      }
    }
    
    # Extract structured data for HIPAA auditing
    if [parsed_json] {
      if [parsed_json][user_id] {
        mutate {
          add_field => { "audit_user_id" => "%{[parsed_json][user_id]}" }
        }
      }
      
      if [parsed_json][action] {
        mutate {
          add_field => { "audit_action" => "%{[parsed_json][action]}" }
        }
      }
      
      if [parsed_json][resource] {
        mutate {
          add_field => { "audit_resource" => "%{[parsed_json][resource]}" }
        }
      }
    }
  }
  
  # Health check log processing
  if [type] == "health-checks" {
    json {
      source => "message"
    }
    
    if [services] {
      ruby {
        code => "
          services = event.get('[services]')
          unhealthy_services = []
          critical_down = false
          
          services.each do |name, service|
            if !service['healthy']
              unhealthy_services << name
              if service['critical']
                critical_down = true
              end
            end
          end
          
          event.set('unhealthy_services', unhealthy_services)
          event.set('critical_service_down', critical_down)
          event.set('unhealthy_count', unhealthy_services.length)
        "
      }
    }
  }
  
  # Security event processing
  if [response_status] {
    if [response_status] == "401" {
      mutate {
        add_field => { "security_event" => "unauthorized_access" }
        add_field => { "alert_level" => "warning" }
      }
    } else if [response_status] == "403" {
      mutate {
        add_field => { "security_event" => "forbidden_access" }
        add_field => { "alert_level" => "warning" }
      }
    } else if [response_status] == "429" {
      mutate {
        add_field => { "security_event" => "rate_limit_exceeded" }
        add_field => { "alert_level" => "info" }
      }
    } else if [response_status] =~ /^5/ {
      mutate {
        add_field => { "security_event" => "server_error" }
        add_field => { "alert_level" => "error" }
      }
    }
  }
  
  # Add common fields
  mutate {
    add_field => { "environment" => "production" }
    add_field => { "application" => "serenity" }
    add_field => { "log_version" => "1.0" }
  }
  
  # Clean up temporary fields
  mutate {
    remove_field => [ "host", "headers" ]
  }
}

output {
  # Main Elasticsearch output
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "serenity-logs-%{+YYYY.MM.dd}"
    template_name => "serenity-logs"
    template => "/usr/share/logstash/templates/serenity-template.json"
    template_overwrite => true
  }
  
  # HIPAA audit logs to separate index
  if [audit_required] == "true" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "serenity-audit-%{+YYYY.MM.dd}"
      template_name => "serenity-audit"
      template => "/usr/share/logstash/templates/serenity-audit-template.json"
      template_overwrite => true
    }
  }
  
  # Security events to security index
  if [security_event] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "serenity-security-%{+YYYY.MM.dd}"
    }
  }
  
  # Critical alerts to webhook
  if [priority] == "critical" or [critical_service_down] == true {
    http {
      url => "http://kong:8000/api/v1/notifications/log-alerts"
      http_method => "post"
      content_type => "application/json"
      headers => {
        "Authorization" => "Bearer ${ALERT_WEBHOOK_TOKEN}"
        "X-Alert-Source" => "logstash"
      }
    }
  }
  
  # Debug output (remove in production)
  if [loglevel] == "DEBUG" {
    stdout { 
      codec => rubydebug 
    }
  }
}