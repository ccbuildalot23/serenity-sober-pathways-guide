# Kubernetes deployment manifests for Serenity microservices
# Deploy to AWS EKS cluster

---
apiVersion: v1
kind: Namespace
metadata:
  name: serenity-prod
  labels:
    name: serenity-prod
    compliance: hipaa

---
# Security Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-service
  namespace: serenity-prod
  labels:
    app: security-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: security-service
  template:
    metadata:
      labels:
        app: security-service
    spec:
      nodeSelector:
        Type: critical
      tolerations:
      - key: critical
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
      - name: security-service
        image: ${ECR_REPO}/security-service:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: security-service
  namespace: serenity-prod
spec:
  selector:
    app: security-service
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP

---
# Notification Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: serenity-prod
  labels:
    app: notification-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: ${ECR_REPO}/notification-service:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: url
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: twilio-secret
              key: account_sid
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: twilio-secret
              key: auth_token
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: sendgrid-secret
              key: api_key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: serenity-prod
spec:
  selector:
    app: notification-service
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP

---
# Gateway Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: serenity-prod
  labels:
    app: gateway-service
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
      - name: gateway-service
        image: ${ECR_REPO}/gateway-service:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        - name: SERVICE_DISCOVERY_URL
          value: "consul.serenity-prod.svc.cluster.local:8500"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: serenity-prod
spec:
  selector:
    app: gateway-service
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer

---
# Horizontal Pod Autoscaler for Gateway
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: serenity-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# Network Policy for service isolation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: serenity-prod
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gateway-service
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 6379  # Redis
    - protocol: TCP
      port: 5672  # RabbitMQ

---
# ConfigMap for shared configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: serenity-prod
data:
  LOG_LEVEL: "info"
  ENABLE_METRICS: "true"
  METRICS_PORT: "9090"
  TRACE_ENABLED: "true"
  JAEGER_ENDPOINT: "http://jaeger-collector.monitoring:14268/api/traces"

---
# Secret for database connection
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: serenity-prod
type: Opaque
stringData:
  url: "postgresql://serenity_admin:${DB_PASSWORD}@${RDS_ENDPOINT}/serenity?sslmode=require"

---
# Secret for Redis connection
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: serenity-prod
type: Opaque
stringData:
  url: "rediss://default:${REDIS_PASSWORD}@${ELASTICACHE_ENDPOINT}:6379"

---
# Secret for RabbitMQ connection
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: serenity-prod
type: Opaque
stringData:
  url: "amqps://admin:${MQ_PASSWORD}@${MQ_ENDPOINT}:5671"

---
# Secret for JWT
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: serenity-prod
type: Opaque
stringData:
  secret: "${JWT_SECRET}"

---
# Ingress for routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: serenity-ingress
  namespace: serenity-prod
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: ${ACM_CERT_ARN}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  rules:
  - host: api.serenity.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway-service
            port:
              number: 80

---
# PodDisruptionBudget for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: serenity-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: gateway-service

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: security-pdb
  namespace: serenity-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: security-service