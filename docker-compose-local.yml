version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: serenity-postgres-local
    environment:
      POSTGRES_DB: serenity
      POSTGRES_USER: serenity_user
      POSTGRES_PASSWORD: serenity_password
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init-mvp-db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/seed-test-users.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serenity_user -d serenity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: serenity-redis-local
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_local_data: