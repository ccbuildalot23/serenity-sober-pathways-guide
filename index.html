<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          // Provide global shims used by some modules
          // eslint-disable-next-line no-var
          var _null = null;
          // eslint-disable-next-line no-var
          var _Boolean = function (v) { return !!v; };
          if (!console._error) {
            try { console._error = console.error.bind(console); } catch (_) { console._error = console.error; }
          }

          var overlay = document.createElement('div');
          overlay.id = 'app-runtime-error';
          overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;display:none;background:rgba(0,0,0,0.6);color:#fff;padding:16px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;';
          var box = document.createElement('pre');
          box.style.cssText = 'white-space:pre-wrap;word-break:break-word;background:#111;padding:16px;border-radius:8px;max-width:960px;margin:40px auto;';
          overlay.appendChild(box);
          document.addEventListener('DOMContentLoaded', function(){ document.body.appendChild(overlay); });
          function show(message){
            try {
              box.textContent = '[Runtime Error] ' + (message || 'Unknown error');
              overlay.style.display = 'block';
            } catch (_e) {}
          }
          window.addEventListener('error', function (e) {
            show((e.error && e.error.stack) || e.message || String(e));
          });
          window.addEventListener('unhandledrejection', function (e) {
            var r = e.reason;
            show((r && (r.stack || r.message)) || String(r));
          });
        } catch (_e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var original = { log: console.log, warn: console.warn, error: console.error };
          var storeKey = 'serenity_runtime_logs';
          function append(level, args) {
            try {
              var logs = [];
              try { logs = JSON.parse(localStorage.getItem(storeKey) || '[]'); } catch (_e) {}
              logs.push({ t: Date.now(), level: level, msg: Array.from(args).map(function(a){ try { return typeof a==='string'? a : (a && a.stack) ? a.stack : JSON.stringify(a); } catch(_e){ return String(a); } }).join(' ') });
              if (logs.length > 200) logs.splice(0, logs.length - 200);
              localStorage.setItem(storeKey, JSON.stringify(logs));
            } catch (_e) {}
          }
          console.log = function(){ append('log', arguments); return original.log.apply(console, arguments); };
          console.warn = function(){ append('warn', arguments); return original.warn.apply(console, arguments); };
          console.error = function(){ append('error', arguments); return original.error.apply(console, arguments); };

          // UI toggle
          var toggle = document.createElement('button');
          toggle.textContent = 'View Logs';
          toggle.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:99998;background:#111;color:#fff;border:1px solid #444;border-radius:6px;padding:8px 10px;font-size:12px;cursor:pointer;opacity:.7';
          toggle.title = 'Open runtime logs (L)';
          var panel = document.createElement('div');
          panel.style.cssText = 'position:fixed;inset:5% 5% auto 5%;height:80%;z-index:99999;background:#0b0b0b;color:#eee;border:1px solid #333;border-radius:8px;display:none;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.5)';
          var header = document.createElement('div');
          header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #222;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px';
          header.textContent = 'Runtime Logs';
          var closeBtn = document.createElement('button');
          closeBtn.textContent = 'Close';
          closeBtn.style.cssText = 'background:#222;color:#eee;border:1px solid #444;border-radius:4px;padding:4px 8px;font-size:12px;cursor:pointer';
          header.appendChild(closeBtn);
          var content = document.createElement('pre');
          content.style.cssText = 'flex:1;margin:0;padding:12px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word';
          panel.appendChild(header); panel.appendChild(content);
          function render(){
            var logs = [];
            try { logs = JSON.parse(localStorage.getItem(storeKey) || '[]'); } catch (_e) {}
            content.textContent = logs.map(function(l){ return new Date(l.t).toISOString() + ' ['+l.level.toUpperCase()+'] ' + l.msg; }).join('\n');
          }
          toggle.onclick = function(){ render(); panel.style.display = 'flex'; };
          closeBtn.onclick = function(){ panel.style.display = 'none'; };
          document.addEventListener('keydown', function(e){ if ((e.key||'').toLowerCase()==='l' && (e.ctrlKey || e.metaKey || !e.shiftKey)) { render(); panel.style.display = panel.style.display==='flex'? 'none' : 'flex'; }});
          document.addEventListener('DOMContentLoaded', function(){ document.body.appendChild(toggle); document.body.appendChild(panel); });
          window.__SERENITY_RUNTIME_LOGS__ = { open: function(){ render(); panel.style.display='flex'; }, read: function(){ try{ return JSON.parse(localStorage.getItem(storeKey)||'[]'); }catch(_e){ return []; } } };
        } catch (_e) {}
      })();
    </script>
