<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          if (location.search.indexOf('dev_bypass=1') > -1) {
            localStorage.setItem('dev_bypass_auth', 'true');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Minimal console shim to prevent runtime errors from custom calls
      (function(){
        try {
          if (!(' _error' in console)) { /* intentional space to avoid minifier rename */ }
          // define console._error to alias console.error if missing
          if (!console._error) { console._error = console.error.bind(console); }
        } catch (e) {}
      })();
    </script>
    <script>
      // CRITICAL: Fallback CSS loader for production builds
      // This ensures CSS is loaded even if Vite fails to inject the link tag
      (function() {
        // Only run after DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', checkAndLoadCSS);
        } else {
          checkAndLoadCSS();
        }
        
        function checkAndLoadCSS() {
          // Check if CSS is already linked
          if (document.querySelector('link[rel="stylesheet"]')) {
            console.log('CSS already linked');
            return;
          }
          
          console.warn('CSS not linked, attempting to load...');
          
          // Try to find and load CSS file
          // Look for main CSS file in assets directory
          const possiblePaths = [
            '/assets/main.css',
            '/assets/index.css',
            '/assets/style.css'
          ];
          
          // Also check for hashed CSS files
          fetch('/assets/').then(response => response.text()).then(html => {
            const cssMatch = html.match(/main-[a-zA-Z0-9]+\.css/);
            if (cssMatch) {
              const link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = '/assets/' + cssMatch[0];
              document.head.appendChild(link);
              console.log('CSS loaded:', link.href);
            }
          }).catch(err => {
            console.error('Failed to auto-load CSS:', err);
            // Last resort: inject minimal critical styles
            const style = document.createElement('style');
            style.textContent = `
              body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
              #root { min-height: 100vh; }
              .hidden { display: none !important; }
            `;
            document.head.appendChild(style);
          });
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Serenity - Mental Health & Recovery Support</title>
    <meta name="description" content="24/7 crisis support and evidence-based recovery tools for mental health and substance abuse. HIPAA-compliant platform trusted by healthcare providers." />
    <meta name="author" content="Serenity Recovery" />
    <meta name="keywords" content="mental health, recovery, crisis support, substance abuse, therapy, CBT, peer support, HIPAA compliant" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Mobile App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Serenity" />
    <meta name="application-name" content="Serenity" />
    <meta name="theme-color" content="#0066CC" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Serenity - Mental Health & Recovery Support" />
    <meta property="og:description" content="24/7 crisis support and evidence-based recovery tools. Get help when you need it most." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://serenityrecovery.app" />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Serenity - Mental Health & Recovery Support" />
    <meta name="twitter:description" content="24/7 crisis support and evidence-based recovery tools. Get help when you need it most." />
    <meta name="twitter:image" content="/twitter-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module">
      // Toggle minimal mode via ?minimal=1 for emergency fallback
      const isMinimal = new URLSearchParams(location.search).has('minimal');
      if (isMinimal) {
        import('/src/AppMinimal.tsx').then(({ default: AppMinimal }) => {
          import('/src/components/theme/ThemeProvider').then(({ ThemeProvider }) => {
            import('react').then(({ StrictMode, createElement }) => {
              import('react-dom/client').then(({ createRoot }) => {
                const root = createRoot(document.getElementById('root'));
                root.render(createElement(StrictMode, null, createElement(ThemeProvider, null, createElement(AppMinimal))));
              });
            });
          });
        });
      } else {
        import('/src/main.tsx');
      }
    </script>
  </body>
</html>
