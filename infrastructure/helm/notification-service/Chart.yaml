apiVersion: v2
name: notification-service
description: Helm chart for Serenity Notification Service - HIPAA compliant notification system for mental health platform
version: 1.0.0
appVersion: "1.0.0"
type: application

keywords:
  - notification
  - microservice
  - healthcare
  - hipaa
  - mental-health
  - serenity

home: https://github.com/serenity/notification-service
sources:
  - https://github.com/serenity/notification-service
  - https://github.com/serenity/serenity-platform

maintainers:
  - name: Serenity Platform Team
    email: platform@serenity.com
    url: https://serenity.com

annotations:
  category: Healthcare
  licenses: Proprietary
  images: |
    - name: notification-service
      image: ghcr.io/serenity/notification-service:1.0.0
    - name: fluent-bit
      image: fluent/fluent-bit:2.0
  
dependencies:
  - name: redis
    version: "17.3.7"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: postgresql
    version: "12.1.2"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: prometheus
    version: "25.8.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled