{{- $_ := include "notification-service.validateValues" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notification-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
  annotations:
    {{- include "notification-service.hipaaAnnotations" . | nindent 4 }}
    deployment.kubernetes.io/revision: "1"
    kubernetes.io/change-cause: "{{ .Values.deployment.changeCause | default "Helm deployment" }}"
spec:
  replicas: {{ include "notification-service.replicaCount" . }}
  strategy:
    {{- toYaml .Values.deployment.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "notification-service.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "notification-service.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.deployment.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "notification-service.hipaaAnnotations" . | nindent 8 }}
        {{- include "notification-service.monitoringAnnotations" . | nindent 8 }}
        # Force restart on config/secret changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.deployment.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "notification-service.serviceAccountName" . }}
      securityContext:
        {{- include "notification-service.podSecurityContext" . | nindent 8 }}
      containers:
      - name: notification-service
        image: {{ include "notification-service.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.container.ports.http }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.container.ports.metrics }}
          protocol: TCP
        - name: websocket
          containerPort: {{ .Values.container.ports.websocket }}
          protocol: TCP
        env:
        # Pod metadata
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # Application configuration
        {{- include "notification-service.configEnv" . | nindent 8 }}
        # Secrets
        {{- include "notification-service.secretEnv" . | nindent 8 }}
        # Additional environment variables
        {{- range $key, $value := .Values.container.env }}
        {{- if not (has $key (list "NODE_ENV" "LOG_LEVEL" "PORT" "METRICS_PORT")) }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "notification-service.fullname" . }}-config
        - secretRef:
            name: {{ include "notification-service.fullname" . }}-secrets
        resources:
          {{- include "notification-service.resources" . | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.container.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.container.readinessProbe | nindent 10 }}
        startupProbe:
          {{- toYaml .Values.container.startupProbe | nindent 10 }}
        securityContext:
          {{- include "notification-service.securityContext" . | nindent 10 }}
        volumeMounts:
          {{- include "notification-service.volumeMounts" . | nindent 8 }}
      
      {{- if .Values.logging.fluentBit.enabled }}
      # Fluent Bit sidecar for log shipping (HIPAA compliance)
      - name: fluent-bit
        image: {{ .Values.logging.fluentBit.image.registry }}/{{ .Values.logging.fluentBit.image.repository }}:{{ .Values.logging.fluentBit.image.tag }}
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc
        - name: logs
          mountPath: /app/logs
          readOnly: true
        {{- if .Values.persistence.auditLogs.enabled }}
        - name: audit-logs
          mountPath: /app/audit-logs
          readOnly: true
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
      {{- end }}
      
      volumes:
        {{- include "notification-service.volumes" . | nindent 6 }}
      
      terminationGracePeriodSeconds: 30
      
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      # Additional pod specifications for HIPAA compliance
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler