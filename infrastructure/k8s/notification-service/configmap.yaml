apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: serenity-platform
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  METRICS_PORT: "9090"
  HEALTH_CHECK_PATH: "/health"
  METRICS_PATH: "/metrics"
  
  # Redis Configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_KEY_PREFIX: "serenity:notification:"
  
  # Database Configuration
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "serenity_notifications"
  DB_SSL: "require"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "20"
  DB_TIMEOUT: "30000"
  
  # Notification Configuration
  EMAIL_PROVIDER: "sendgrid"
  SMS_PROVIDER: "twilio"
  PUSH_PROVIDER: "firebase"
  
  # Rate Limiting
  RATE_LIMIT_WINDOW: "900000" # 15 minutes
  RATE_LIMIT_MAX: "1000"
  
  # WebSocket Configuration
  WS_HEARTBEAT_INTERVAL: "30000"
  WS_TIMEOUT: "60000"
  
  # Security Configuration
  CORS_ORIGIN: "https://app.serenity.com"
  HELMET_ENABLED: "true"
  
  # Monitoring Configuration
  PROMETHEUS_ENABLED: "true"
  TRACING_ENABLED: "true"
  JAEGER_ENDPOINT: "http://jaeger-collector:14268/api/traces"
  
  # HIPAA Compliance
  AUDIT_LOG_ENABLED: "true"
  ENCRYPTION_ENABLED: "true"
  PHI_MASKING_ENABLED: "true"
  
  # Queue Configuration
  QUEUE_REDIS_DB: "1"
  QUEUE_CONCURRENCY: "10"
  QUEUE_RETRY_ATTEMPTS: "3"
  QUEUE_RETRY_BACKOFF: "exponential"
  
  # Circuit Breaker
  CIRCUIT_BREAKER_ENABLED: "true"
  CIRCUIT_BREAKER_THRESHOLD: "5"
  CIRCUIT_BREAKER_TIMEOUT: "60000"
  
  # Cache Configuration
  CACHE_TTL: "300" # 5 minutes
  CACHE_MAX_SIZE: "1000"
  
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config-staging
  namespace: notification-service-staging
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: serenity-platform
data:
  NODE_ENV: "staging"
  LOG_LEVEL: "debug"
  PORT: "3000"
  METRICS_PORT: "9090"
  
  # Staging-specific overrides
  REDIS_HOST: "redis-staging-service"
  DB_HOST: "postgres-staging-service"
  DB_NAME: "serenity_notifications_staging"
  
  # Relaxed rate limiting for testing
  RATE_LIMIT_MAX: "5000"
  
  # Enhanced monitoring for staging
  TRACING_ENABLED: "true"
  LOG_LEVEL: "debug"
  
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config-dev
  namespace: notification-service-dev
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: serenity-platform
data:
  NODE_ENV: "development"
  LOG_LEVEL: "debug"
  PORT: "3000"
  METRICS_PORT: "9090"
  
  # Development-specific settings
  REDIS_HOST: "redis-dev-service"
  DB_HOST: "postgres-dev-service"
  DB_NAME: "serenity_notifications_dev"
  
  # Disabled security features for development
  CORS_ORIGIN: "*"
  RATE_LIMIT_MAX: "10000"
  
  # Mock providers for development
  EMAIL_PROVIDER: "mock"
  SMS_PROVIDER: "mock"
  PUSH_PROVIDER: "mock"