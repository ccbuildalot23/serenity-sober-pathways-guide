apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secrets
  namespace: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: serenity-platform
type: Opaque
stringData:
  # Database Credentials
  DATABASE_URL: "postgresql://notifications_user:${DB_PASSWORD}@postgres-service:5432/serenity_notifications?sslmode=require"
  DB_PASSWORD: "${DB_PASSWORD}"
  
  # Redis Password
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis-service:6379/0"
  
  # JWT Secrets
  JWT_SECRET: "${JWT_SECRET}"
  JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
  
  # Encryption Keys
  ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
  ENCRYPTION_IV: "${ENCRYPTION_IV}"
  
  # External Service API Keys
  SENDGRID_API_KEY: "${SENDGRID_API_KEY}"
  TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
  TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
  TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER}"
  
  # Firebase Configuration
  FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
  FIREBASE_CLIENT_EMAIL: "${FIREBASE_CLIENT_EMAIL}"
  FIREBASE_PRIVATE_KEY: "${FIREBASE_PRIVATE_KEY}"
  
  # AWS Configuration
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  AWS_REGION: "${AWS_REGION}"
  AWS_S3_BUCKET: "${AWS_S3_BUCKET}"
  
  # Monitoring & APM
  DATADOG_API_KEY: "${DATADOG_API_KEY}"
  NEWRELIC_LICENSE_KEY: "${NEWRELIC_LICENSE_KEY}"
  SENTRY_DSN: "${SENTRY_DSN}"
  
  # HIPAA Audit Logging
  AUDIT_ENCRYPTION_KEY: "${AUDIT_ENCRYPTION_KEY}"
  COMPLIANCE_WEBHOOK_SECRET: "${COMPLIANCE_WEBHOOK_SECRET}"
  
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secrets-staging
  namespace: notification-service-staging
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: serenity-platform
type: Opaque
stringData:
  # Staging Database
  DATABASE_URL: "postgresql://notifications_user_staging:${STAGING_DB_PASSWORD}@postgres-staging-service:5432/serenity_notifications_staging?sslmode=require"
  DB_PASSWORD: "${STAGING_DB_PASSWORD}"
  
  # Staging Redis
  REDIS_PASSWORD: "${STAGING_REDIS_PASSWORD}"
  REDIS_URL: "redis://:${STAGING_REDIS_PASSWORD}@redis-staging-service:6379/0"
  
  # Staging JWT Secrets
  JWT_SECRET: "${STAGING_JWT_SECRET}"
  JWT_REFRESH_SECRET: "${STAGING_JWT_REFRESH_SECRET}"
  
  # Staging External Services (Test accounts)
  SENDGRID_API_KEY: "${STAGING_SENDGRID_API_KEY}"
  TWILIO_ACCOUNT_SID: "${STAGING_TWILIO_ACCOUNT_SID}"
  TWILIO_AUTH_TOKEN: "${STAGING_TWILIO_AUTH_TOKEN}"
  TWILIO_PHONE_NUMBER: "${STAGING_TWILIO_PHONE_NUMBER}"
  
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secrets-dev
  namespace: notification-service-dev
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: serenity-platform
type: Opaque
stringData:
  # Development Database
  DATABASE_URL: "postgresql://dev_user:dev_password@postgres-dev-service:5432/serenity_notifications_dev"
  DB_PASSWORD: "dev_password"
  
  # Development Redis
  REDIS_PASSWORD: ""
  REDIS_URL: "redis://redis-dev-service:6379/0"
  
  # Development JWT Secrets (not secure - for dev only)
  JWT_SECRET: "dev-jwt-secret-not-for-production"
  JWT_REFRESH_SECRET: "dev-jwt-refresh-secret-not-for-production"
  
  # Mock service configurations
  SENDGRID_API_KEY: "mock-sendgrid-key"
  TWILIO_ACCOUNT_SID: "mock-twilio-sid"
  TWILIO_AUTH_TOKEN: "mock-twilio-token"
  TWILIO_PHONE_NUMBER: "+1234567890"
  
---
# External Secrets Operator Configuration (Production)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: notification-service
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyID:
            name: aws-credentials
            key: access-key-id
          secretAccessKey:
            name: aws-credentials
            key: secret-access-key

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: notification-service-external-secrets
  namespace: notification-service
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: notification-service-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgresql://{{ .db_username }}:{{ .db_password }}@postgres-service:5432/serenity_notifications?sslmode=require"
        REDIS_URL: "redis://:{{ .redis_password }}@redis-service:6379/0"
        JWT_SECRET: "{{ .jwt_secret }}"
        SENDGRID_API_KEY: "{{ .sendgrid_api_key }}"
        TWILIO_AUTH_TOKEN: "{{ .twilio_auth_token }}"
  data:
  - secretKey: db_username
    remoteRef:
      key: serenity/notification-service/production
      property: db_username
  - secretKey: db_password
    remoteRef:
      key: serenity/notification-service/production
      property: db_password
  - secretKey: redis_password
    remoteRef:
      key: serenity/notification-service/production
      property: redis_password
  - secretKey: jwt_secret
    remoteRef:
      key: serenity/notification-service/production
      property: jwt_secret
  - secretKey: sendgrid_api_key
    remoteRef:
      key: serenity/notification-service/production
      property: sendgrid_api_key
  - secretKey: twilio_auth_token
    remoteRef:
      key: serenity/notification-service/production
      property: twilio_auth_token