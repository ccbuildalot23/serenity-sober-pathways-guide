# Logstash Configuration for Serenity
# HIPAA-compliant log processing with PHI protection

input {
  # Docker logs
  beats {
    port => 5044
  }
  
  # Direct syslog
  syslog {
    port => 5140
  }
  
  # Application logs via TCP
  tcp {
    port => 5000
    codec => json_lines
  }
  
  # HTTP input for webhooks
  http {
    port => 8080
    codec => json
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
  }
  
  # Add metadata
  mutate {
    add_field => { "environment" => "${ENVIRONMENT:production}" }
    add_field => { "application" => "serenity" }
    add_field => { "log_processed_at" => "%{@timestamp}" }
  }
  
  # Parse container logs
  if [container][name] {
    mutate {
      add_field => { "service_name" => "%{[container][name]}" }
    }
  }
  
  # Detect and anonymize PHI data
  # Remove SSN patterns
  mutate {
    gsub => [
      "message", "\b\d{3}-\d{2}-\d{4}\b", "[SSN-REDACTED]",
      "message", "\b\d{9}\b", "[SSN-REDACTED]"
    ]
  }
  
  # Remove credit card patterns
  mutate {
    gsub => [
      "message", "\b\d{4}[-\s]?\d{4}[-\s]?\d{4}[-\s]?\d{4}\b", "[CC-REDACTED]"
    ]
  }
  
  # Remove phone number patterns
  mutate {
    gsub => [
      "message", "\b\d{3}[-.]?\d{3}[-.]?\d{4}\b", "[PHONE-REDACTED]"
    ]
  }
  
  # Remove email patterns from logs (but keep for auth service)
  if [service_name] != "auth-service" {
    mutate {
      gsub => [
        "message", "\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b", "[EMAIL-REDACTED]"
      ]
    }
  }
  
  # Parse timestamps
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }
  
  # Set log levels
  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  } else {
    mutate {
      add_field => { "level" => "INFO" }
    }
  }
  
  # Add severity scoring for alerting
  if [level] == "ERROR" or [level] == "FATAL" {
    mutate {
      add_field => { "severity_score" => 3 }
    }
  } else if [level] == "WARN" {
    mutate {
      add_field => { "severity_score" => 2 }
    }
  } else {
    mutate {
      add_field => { "severity_score" => 1 }
    }
  }
  
  # Parse user agent strings
  if [user_agent] {
    useragent {
      source => "user_agent"
    }
  }
  
  # GeoIP for security analysis (anonymized)
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
      # Remove precise location for HIPAA compliance
      remove_field => ["[geoip][latitude]", "[geoip][longitude]", "[geoip][location]"]
    }
  }
  
  # Detect potential security threats
  if [message] =~ /(?i)(injection|xss|csrf|malware|virus|attack)/ {
    mutate {
      add_tag => ["security_threat"]
      add_field => { "alert_type" => "security" }
    }
  }
  
  # Detect high-frequency errors
  if [level] == "ERROR" {
    mutate {
      add_tag => ["error_alert"]
    }
  }
  
  # Service-specific parsing
  if [service_name] == "auth-service" {
    # Authentication events
    if [message] =~ /(?i)(login|logout|authentication|authorization)/ {
      mutate {
        add_tag => ["auth_event"]
      }
    }
    
    # Failed login attempts
    if [message] =~ /(?i)(failed|invalid|unauthorized)/ {
      mutate {
        add_tag => ["failed_auth"]
        add_field => { "alert_type" => "auth_failure" }
      }
    }
  }
  
  if [service_name] == "crisis-service" {
    # Crisis alerts
    if [message] =~ /(?i)(crisis|emergency|alert|critical)/ {
      mutate {
        add_tag => ["crisis_event"]
        add_field => { "alert_type" => "crisis" }
        add_field => { "severity_score" => 4 }
      }
    }
  }
  
  if [service_name] == "notification-service" {
    # Notification delivery tracking
    if [message] =~ /(?i)(sent|delivered|failed|bounced)/ {
      mutate {
        add_tag => ["notification_delivery"]
      }
    }
  }
  
  # Remove sensitive fields
  mutate {
    remove_field => ["password", "token", "secret", "key", "credentials"]
  }
  
  # Add index pattern based on service
  mutate {
    add_field => { "[@metadata][index_suffix]" => "%{service_name:unknown}-%{+YYYY.MM.dd}" }
  }
}

output {
  # Main Elasticsearch output
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:elasticsearch:9200}"]
    index => "serenity-%{[@metadata][index_suffix]}"
    template_name => "serenity"
    template_pattern => "serenity-*"
    template => {
      "index_patterns" => ["serenity-*"],
      "settings" => {
        "number_of_shards" => 1,
        "number_of_replicas" => 1,
        "index.refresh_interval" => "30s"
      },
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" },
          "level" => { "type" => "keyword" },
          "service_name" => { "type" => "keyword" },
          "message" => { "type" => "text" },
          "severity_score" => { "type" => "integer" },
          "environment" => { "type" => "keyword" },
          "alert_type" => { "type" => "keyword" }
        }
      }
    }
  }
  
  # Security alerts to separate index
  if "security_threat" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:elasticsearch:9200}"]
      index => "serenity-security-%{+YYYY.MM.dd}"
    }
  }
  
  # Crisis events to separate index for immediate alerting
  if "crisis_event" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:elasticsearch:9200}"]
      index => "serenity-crisis-%{+YYYY.MM.dd}"
    }
  }
  
  # Send high severity events to alerting system
  if [severity_score] >= 3 {
    http {
      url => "${ALERT_WEBHOOK_URL:http://alertmanager:9093/api/v1/alerts}"
      http_method => "post"
      format => "json"
      mapping => {
        "alerts" => [{
          "labels" => {
            "alertname" => "HighSeverityLog"
            "service" => "%{service_name}"
            "level" => "%{level}"
            "environment" => "%{environment}"
          }
          "annotations" => {
            "summary" => "High severity log event detected"
            "description" => "%{message}"
          }
        }]
      }
    }
  }
  
  # Output to stdout for debugging (only in development)
  if "${ENVIRONMENT:production}" == "development" {
    stdout {
      codec => rubydebug {
        metadata => true
      }
    }
  }
}