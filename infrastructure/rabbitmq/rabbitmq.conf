# RabbitMQ Configuration for Serenity Production
# HIPAA-compliant messaging configuration

# Cluster configuration
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2

# Network configuration
listeners.tcp.default = 5672
listeners.ssl.default = 5671

# Management plugin
management.listener.port = 15672
management.listener.ssl = false

# SSL/TLS configuration
ssl_options.cacertfile = /etc/rabbitmq/certs/ca.crt
ssl_options.certfile   = /etc/rabbitmq/certs/server.crt
ssl_options.keyfile    = /etc/rabbitmq/certs/server.key
ssl_options.verify     = verify_peer
ssl_options.fail_if_no_peer_cert = true
ssl_options.versions.1 = tlsv1.2
ssl_options.versions.2 = tlsv1.3

# Authentication and authorization
auth_backends.1 = internal
default_user = serenity
default_pass = RABBITMQ_PASSWORD_PLACEHOLDER
default_user_tags.administrator = true
default_vhost = serenity

# Memory and disk limits
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Logging
log.file = /var/log/rabbitmq/rabbit.log
log.file.level = info
log.file.rotation.date = $D0
log.file.rotation.size = 100MB

log.console = true
log.console.level = info

# Connection settings
heartbeat = 600
frame_max = 131072
channel_max = 2047
connection_max = 65535

# Queue settings
queue_master_locator = min-masters
ha_policy_all.pattern = .*
ha_policy_all.definition.ha-mode = all
ha_policy_all.definition.ha-sync-mode = automatic

# Clustering
cluster_partition_handling = autoheal
cluster_keepalive_interval = 10000

# Memory configuration
total_memory_available_override_value = 1073741824

# Background GC
background_gc_enabled = true
background_gc_target_interval = 60000

# TCP listeners
tcp_listen_options.backlog = 128
tcp_listen_options.nodelay = true
tcp_listen_options.linger.on = true
tcp_listen_options.linger.timeout = 0
tcp_listen_options.exit_on_close = false

# HIPAA compliance settings
collect_statistics = coarse
collect_statistics_interval = 5000

# Management API settings
management.http_log_dir = /var/log/rabbitmq
management.rates_mode = basic

# Plugin configuration
plugins.1 = rabbitmq_management
plugins.2 = rabbitmq_prometheus
plugins.3 = rabbitmq_shovel
plugins.4 = rabbitmq_shovel_management

# Prometheus metrics
prometheus.tcp.port = 15692
prometheus.return_per_object_metrics = true

# Security
loopback_users = none
reverse_dns_lookups = false

# Performance tuning
channel_operation_timeout = 15000
mirroring_sync_batch_size = 4096

# Dead letter exchange
dead_letter_exchange = dlx
dead_letter_routing_key = failed

# Message TTL
message_ttl = 86400000  # 24 hours

# Policy definitions for HIPAA compliance
policy.1.name = ha-all
policy.1.pattern = ^(?!amq\\.).+
policy.1.vhost = serenity
policy.1.definition.ha-mode = all
policy.1.definition.ha-sync-mode = automatic
policy.1.definition.message-ttl = 86400000