# Redis Configuration for Serenity Production
# HIPAA-compliant configuration with security hardening

# Network
bind 0.0.0.0
port 6379
protected-mode yes

# Authentication
requirepass REDIS_PASSWORD_PLACEHOLDER

# TLS/SSL (optional for production)
# tls-port 6380
# tls-cert-file /etc/redis/certs/redis.crt
# tls-key-file /etc/redis/certs/redis.key
# tls-ca-cert-file /etc/redis/certs/ca.crt

# Persistence
save 900 1    # Save if at least 1 key changed in 900 seconds
save 300 10   # Save if at least 10 keys changed in 300 seconds
save 60 10000 # Save if at least 10000 keys changed in 60 seconds

# RDB settings
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF settings
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory management
maxmemory 1gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Security settings
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command EVAL ""
rename-command DEBUG ""
rename-command SHUTDOWN SHUTDOWN_SECRET_KEY

# Logging
loglevel notice
logfile "/var/log/redis/redis-server.log"
syslog-enabled yes
syslog-ident redis

# Client settings
timeout 300
tcp-keepalive 300
tcp-backlog 511

# Performance settings
databases 16
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Replica settings (for clustering)
# repl-timeout 60
# repl-ping-replica-period 10
# repl-backlog-size 1mb
# repl-backlog-ttl 3600

# Lua scripting timeout
lua-time-limit 5000

# Event notification
notify-keyspace-events ""

# Hash settings
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List settings
list-max-ziplist-size -2
list-compress-depth 0

# Set settings
set-max-intset-entries 512

# Sorted set settings
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog settings
hll-sparse-max-bytes 3000

# Streams settings
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# hz setting
hz 10

# ACL (Access Control List) settings for Redis 6+
# aclfile /etc/redis/users.acl

# Module loading (if needed)
# loadmodule /path/to/module.so

# HIPAA compliance settings
# Disable potentially dangerous commands
rename-command KEYS ""
rename-command CONFIG ""
rename-command SAVE ""
rename-command BGSAVE ""

# Enable memory usage tracking
tracking-table-max-keys 1000000