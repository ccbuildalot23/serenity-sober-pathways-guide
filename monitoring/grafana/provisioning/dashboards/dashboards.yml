apiVersion: 1

providers:
  - name: 'serenity-dashboards'
    org_id: 1
    folder: 'Serenity Healthcare'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards

  - name: 'hipaa-compliance'
    org_id: 1
    folder: 'HIPAA Compliance'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/hipaa

  - name: 'crisis-monitoring'
    org_id: 1
    folder: 'Crisis Response'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 5
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/crisis