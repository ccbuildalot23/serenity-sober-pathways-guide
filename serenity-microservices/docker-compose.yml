version: '3.8'

services:
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: serenity
      POSTGRES_USER: serenity
      POSTGRES_PASSWORD: ${DB_PASSWORD:-serenity123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - serenity-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serenity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - serenity-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: serenity
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    networks:
      - serenity-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  consul:
    image: consul:latest
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - consul_data:/consul/data
    networks:
      - serenity-network
    healthcheck:
      test: ["CMD", "consul", "info"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitoring Services
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - serenity-network

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    networks:
      - serenity-network
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"  # UI
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    networks:
      - serenity-network

  # Gateway Service
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    ports:
      - "80:3000"
      - "443:3443"
    networks:
      - serenity-network
    depends_on:
      - redis
      - consul
      - jaeger
    restart: unless-stopped

  # Security Service
  security:
    build:
      context: ./services/security
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://serenity:${DB_PASSWORD:-serenity123}@postgres:5432/serenity
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    networks:
      - serenity-network
    depends_on:
      - postgres
      - redis
      - consul
    restart: unless-stopped

  # Notification Service
  notifications:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://serenity:${DB_PASSWORD:-serenity123}@postgres:5432/serenity
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      RABBITMQ_URL: amqp://serenity:${RABBITMQ_PASSWORD:-rabbitmq123}@rabbitmq:5672
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    networks:
      - serenity-network
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - consul
    restart: unless-stopped

  # Identity Service
  identity:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://serenity:${DB_PASSWORD:-serenity123}@postgres:5432/serenity
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    networks:
      - serenity-network
    depends_on:
      - postgres
      - redis
      - consul
    restart: unless-stopped

  # Checkins Service
  checkins:
    build:
      context: ./services/checkins
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgresql://serenity:${DB_PASSWORD:-serenity123}@postgres:5432/serenity
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      RABBITMQ_URL: amqp://serenity:${RABBITMQ_PASSWORD:-rabbitmq123}@rabbitmq:5672
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    networks:
      - serenity-network
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - consul
    restart: unless-stopped

  # Crisis Service
  crisis:
    build:
      context: ./services/crisis
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://serenity:${DB_PASSWORD:-serenity123}@postgres:5432/serenity
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      RABBITMQ_URL: amqp://serenity:${RABBITMQ_PASSWORD:-rabbitmq123}@rabbitmq:5672
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    networks:
      - serenity-network
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - consul
    restart: unless-stopped

  # Communication Service
  communication:
    build:
      context: ./services/communication
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3006
      DATABASE_URL: postgresql://serenity:${DB_PASSWORD:-serenity123}@postgres:5432/serenity
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      RABBITMQ_URL: amqp://serenity:${RABBITMQ_PASSWORD:-rabbitmq123}@rabbitmq:5672
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    networks:
      - serenity-network
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - consul
    restart: unless-stopped

  # Clinical Service
  clinical:
    build:
      context: ./services/clinical
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3007
      DATABASE_URL: postgresql://serenity:${DB_PASSWORD:-serenity123}@postgres:5432/serenity
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    networks:
      - serenity-network
    depends_on:
      - postgres
      - redis
      - consul
    restart: unless-stopped

  # Support Network Service
  support-network:
    build:
      context: ./services/support-network
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3008
      DATABASE_URL: postgresql://serenity:${DB_PASSWORD:-serenity123}@postgres:5432/serenity
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      RABBITMQ_URL: amqp://serenity:${RABBITMQ_PASSWORD:-rabbitmq123}@rabbitmq:5672
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    networks:
      - serenity-network
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - consul
    restart: unless-stopped

  # Analytics Service
  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3009
      DATABASE_URL: postgresql://serenity:${DB_PASSWORD:-serenity123}@postgres:5432/serenity
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    networks:
      - serenity-network
    depends_on:
      - postgres
      - redis
      - consul
    restart: unless-stopped

  # Files Service
  files:
    build:
      context: ./services/files
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3010
      DATABASE_URL: postgresql://serenity:${DB_PASSWORD:-serenity123}@postgres:5432/serenity
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      S3_BUCKET: ${S3_BUCKET:-serenity-files}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - files_data:/app/uploads
    networks:
      - serenity-network
    depends_on:
      - postgres
      - redis
      - consul
    restart: unless-stopped

networks:
  serenity-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  consul_data:
  prometheus_data:
  grafana_data:
  files_data: