version: '3.8'

services:
  # API Gateway Service
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: serenity/api-gateway:latest
    container_name: serenity-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      
      # Service Discovery
      - SERVICE_DISCOVERY_TYPE=consul
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - SERVICE_NAME=api-gateway
      - SERVICE_VERSION=1.0.0
      
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=7d
      
      # API Keys
      - API_KEY_SALT=${API_KEY_SALT}
      - API_KEY_HEADER=X-API-Key
      
      # Rate Limiting
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      
      # Circuit Breaker
      - CIRCUIT_BREAKER_TIMEOUT=3000
      - CIRCUIT_BREAKER_ERROR_THRESHOLD=50
      - CIRCUIT_BREAKER_RESET_TIMEOUT=30000
      
      # Monitoring
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - PROMETHEUS_ENABLED=true
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      
      # CORS
      - CORS_ORIGIN=http://localhost:8080,https://serenity.app
      - CORS_CREDENTIALS=true
      
      # File Upload
      - MAX_FILE_SIZE=10485760
      - ALLOWED_FILE_TYPES=image/jpeg,image/png,image/gif,application/pdf
      - UPLOAD_DIR=/app/uploads
      
      # WebSocket
      - WS_ENABLED=true
      - WS_PATH=/ws
      
      # GraphQL
      - GRAPHQL_ENABLED=true
      - GRAPHQL_PATH=/graphql
      - GRAPHQL_PLAYGROUND=false
      
      # Security
      - HELMET_ENABLED=true
      - COMPRESSION_ENABLED=true
      - TRUST_PROXY=true
      
      # Service URLs
      - USER_SERVICE_URL=http://user-service:3001
      - NOTIFICATION_SERVICE_URL=http://notification-service:3002
      - CHECKIN_SERVICE_URL=http://checkin-service:3003
      - CRISIS_SERVICE_URL=http://crisis-service:3004
      - CLINICAL_SERVICE_URL=http://clinical-service:3005
      - SUPPORT_NETWORK_SERVICE_URL=http://support-network-service:3006
      - ANALYTICS_SERVICE_URL=http://analytics-service:3007
      - FILES_SERVICE_URL=http://files-service:3008
      - COMMUNICATION_SERVICE_URL=http://communication-service:3009
      
    volumes:
      - gateway-logs:/app/logs
      - gateway-uploads:/app/uploads
    networks:
      - serenity-network
    depends_on:
      - redis
      - consul
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`api.serenity.local`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.services.gateway.loadbalancer.server.port=3000"

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: serenity-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - serenity-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # Consul for service discovery
  consul:
    image: consul:1.16
    container_name: serenity-consul
    restart: unless-stopped
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    command: >
      consul agent
      -server
      -bootstrap-expect=1
      -ui
      -bind=0.0.0.0
      -client=0.0.0.0
      -datacenter=serenity
      -data-dir=/consul/data
      -log-level=INFO
    volumes:
      - consul-data:/consul/data
    networks:
      - serenity-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: serenity-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - serenity-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: serenity-jaeger
    restart: unless-stopped
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - serenity-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:14269/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Grafana for monitoring dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: serenity-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - serenity-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

volumes:
  gateway-logs:
    driver: local
  gateway-uploads:
    driver: local
  redis-data:
    driver: local
  consul-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  serenity-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16