version: '3.8'\n\nservices:\n  # Notification Service\n  notification-service:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    container_name: serenity-notification-service\n    restart: unless-stopped\n    ports:\n      - \"3000:3000\"\n    environment:\n      - NODE_ENV=production\n      - PORT=3000\n      - DATABASE_URL=postgresql://postgres:serenity123@postgres:5432/serenity_notifications\n      - REDIS_URL=redis://redis:6379\n      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key}\n      - SENDGRID_API_KEY=${SENDGRID_API_KEY}\n      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}\n      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}\n      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}\n      - WEB_PUSH_VAPID_PUBLIC_KEY=${WEB_PUSH_VAPID_PUBLIC_KEY}\n      - WEB_PUSH_VAPID_PRIVATE_KEY=${WEB_PUSH_VAPID_PRIVATE_KEY}\n      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-12345678901234567890123456789012}\n      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-webhook-secret}\n    depends_on:\n      postgres:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    networks:\n      - serenity-network\n    volumes:\n      - notification-logs:/app/logs\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:3000/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 40s\n    deploy:\n      resources:\n        limits:\n          memory: 512M\n          cpus: '0.5'\n        reservations:\n          memory: 256M\n          cpus: '0.25'\n    logging:\n      driver: json-file\n      options:\n        max-size: \"10m\"\n        max-file: \"3\"\n\n  # Queue Worker (separate instance for processing)\n  notification-worker:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    container_name: serenity-notification-worker\n    restart: unless-stopped\n    environment:\n      - NODE_ENV=production\n      - DATABASE_URL=postgresql://postgres:serenity123@postgres:5432/serenity_notifications\n      - REDIS_URL=redis://redis:6379\n      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key}\n      - SENDGRID_API_KEY=${SENDGRID_API_KEY}\n      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}\n      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}\n      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}\n      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-12345678901234567890123456789012}\n      - QUEUE_CONCURRENCY=5\n    command: [\"node\", \"dist/workers/index.js\"]\n    depends_on:\n      postgres:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    networks:\n      - serenity-network\n    volumes:\n      - notification-logs:/app/logs\n    deploy:\n      resources:\n        limits:\n          memory: 256M\n          cpus: '0.3'\n        reservations:\n          memory: 128M\n          cpus: '0.1'\n    logging:\n      driver: json-file\n      options:\n        max-size: \"10m\"\n        max-file: \"3\"\n\n  # PostgreSQL Database\n  postgres:\n    image: postgres:15-alpine\n    container_name: serenity-postgres\n    restart: unless-stopped\n    environment:\n      - POSTGRES_DB=serenity_notifications\n      - POSTGRES_USER=postgres\n      - POSTGRES_PASSWORD=serenity123\n    ports:\n      - \"5432:5432\"\n    volumes:\n      - postgres-data:/var/lib/postgresql/data\n      - ./migrations:/docker-entrypoint-initdb.d\n    networks:\n      - serenity-network\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U postgres -d serenity_notifications\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n      start_period: 30s\n    deploy:\n      resources:\n        limits:\n          memory: 512M\n          cpus: '0.5'\n        reservations:\n          memory: 256M\n          cpus: '0.25'\n    logging:\n      driver: json-file\n      options:\n        max-size: \"10m\"\n        max-file: \"3\"\n\n  # Redis Cache and Queue\n  redis:\n    image: redis:7-alpine\n    container_name: serenity-redis\n    restart: unless-stopped\n    ports:\n      - \"6379:6379\"\n    volumes:\n      - redis-data:/data\n      - ./redis.conf:/etc/redis/redis.conf:ro\n    command: redis-server /etc/redis/redis.conf\n    networks:\n      - serenity-network\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 10s\n      timeout: 3s\n      retries: 3\n    deploy:\n      resources:\n        limits:\n          memory: 256M\n          cpus: '0.3'\n        reservations:\n          memory: 128M\n          cpus: '0.1'\n    logging:\n      driver: json-file\n      options:\n        max-size: \"5m\"\n        max-file: \"3\"\n\n  # Prometheus (monitoring)\n  prometheus:\n    image: prom/prometheus:latest\n    container_name: serenity-prometheus\n    restart: unless-stopped\n    ports:\n      - \"9090:9090\"\n    volumes:\n      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro\n      - prometheus-data:/prometheus\n    command:\n      - '--config.file=/etc/prometheus/prometheus.yml'\n      - '--storage.tsdb.path=/prometheus'\n      - '--web.console.libraries=/etc/prometheus/console_libraries'\n      - '--web.console.templates=/etc/prometheus/consoles'\n      - '--storage.tsdb.retention.time=200h'\n      - '--web.enable-lifecycle'\n    networks:\n      - serenity-network\n    deploy:\n      resources:\n        limits:\n          memory: 512M\n          cpus: '0.3'\n    logging:\n      driver: json-file\n      options:\n        max-size: \"5m\"\n        max-file: \"3\"\n\n  # Grafana (visualization)\n  grafana:\n    image: grafana/grafana:latest\n    container_name: serenity-grafana\n    restart: unless-stopped\n    ports:\n      - \"3001:3000\"\n    environment:\n      - GF_SECURITY_ADMIN_PASSWORD=admin123\n      - GF_USERS_ALLOW_SIGN_UP=false\n    volumes:\n      - grafana-data:/var/lib/grafana\n      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro\n      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro\n    networks:\n      - serenity-network\n    depends_on:\n      - prometheus\n    deploy:\n      resources:\n        limits:\n          memory: 256M\n          cpus: '0.2'\n    logging:\n      driver: json-file\n      options:\n        max-size: \"5m\"\n        max-file: \"3\"\n\n  # Nginx (reverse proxy and load balancer)\n  nginx:\n    image: nginx:alpine\n    container_name: serenity-nginx\n    restart: unless-stopped\n    ports:\n      - \"80:80\"\n      - \"443:443\"\n    volumes:\n      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro\n      - ./nginx/ssl:/etc/nginx/ssl:ro\n    depends_on:\n      - notification-service\n    networks:\n      - serenity-network\n    deploy:\n      resources:\n        limits:\n          memory: 128M\n          cpus: '0.1'\n    logging:\n      driver: json-file\n      options:\n        max-size: \"5m\"\n        max-file: \"3\"\n\nvolumes:\n  postgres-data:\n    driver: local\n  redis-data:\n    driver: local\n  prometheus-data:\n    driver: local\n  grafana-data:\n    driver: local\n  notification-logs:\n    driver: local\n\nnetworks:\n  serenity-network:\n    driver: bridge\n    ipam:\n      config:\n        - subnet: 172.20.0.0/16